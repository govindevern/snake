[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "snake-language"
version = "1.1.0"
description = "The independent Snake programming language and standalone interpreter"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Snake Language Contributors" }]

[project.scripts]
snake = "snake_lang.cli:main"

[project.optional-dependencies]
build = ["PyInstaller==6.22.3"]

[tool.setuptools]
packages = ["snake_lang"]
